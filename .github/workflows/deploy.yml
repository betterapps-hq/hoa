name: Deploy

on:
  push:
    branches: [main]

# Deploys run one at a time, in merge order, and a running deploy is never cancelled.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  # Skipped until the Cloudflare account is connected (see apps/hoa/docs/setup.md).
  deploy:
    name: Deploy the demo
    needs: verify
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter hoa build
      - run: pnpm --filter hoa run deploy:demo
