name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo Remote Cache. Set TURBO_TOKEN (secret) and TURBO_TEAM (variable) in the
  # repository settings to share the cache across CI runs and contributors.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm check:change` runs `beachball check`, which diffs against
          # origin/main, so the full git history must be available.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm verify

  # Merges to main deploy the demo, only after verification passes.
  deploy:
    name: Deploy the demo
    needs: verify
    # Skipped until the Cloudflare account is connected (see apps/hoa/docs/setup.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ vars.DEMO_URL }}
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter hoa build
      - run: pnpm --filter hoa run deploy:demo

  # Every pull request gets its own Worker Preview, kept up to date on each push.
  preview:
    name: Deploy a preview
    needs: verify
    if: github.event_name == 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter hoa build
      - name: Deploy the preview
        id: preview
        run: |
          pnpm --filter hoa run deploy:preview --name "$PREVIEW_NAME" 2>&1 | tee preview.log
          url=$(grep -oE "https://${PREVIEW_NAME}-hoa\.[a-z0-9.-]+\.workers\.dev" preview.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          body="**Preview:** ${PREVIEW_URL:-see the Deploy a preview job log} (commit ${GITHUB_SHA::7})"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body" --edit-last --create-if-none
