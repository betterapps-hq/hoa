name: Pull request

on:
  pull_request:

# A new push to the pull request replaces the run for the previous one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The required verification, `pnpm verify`, through the shared template. deploy.yml calls it the same way.
  verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@ee2dce3e338d7684c9a8ec2a733d37d1bd5cf7dc # v1.3.0
    with:
      concurrency-key: ${{ github.event.pull_request.number || github.run_id }}
      # Turborepo's remote cache, the one every monorepo shares (turbo.json signs its artifacts). Until the repository
      # has the TURBO_TOKEN and TURBO_REMOTE_CACHE_SIGNATURE_KEY secrets, Turbo uses only its local cache.
      env: |
        TURBO_API=https://turbo.copacker.ai
        TURBO_TEAM=hoa
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # Every pull request gets its own Worker Preview, kept up to date on each push.
  # Skipped until the Cloudflare account is connected (see apps/hoa/docs/setup.md), and for Dependabot's and forks'
  # pull requests, whose runs don't get the Cloudflare token. Going by the author rather than who started the run keeps
  # the choice the same for every run of a pull request, so preview-cleanup.yml skips the same ones.
  preview:
    name: Deploy a preview
    needs: verify
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' && github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@efa1c3e00652cca72174fdf3abdb911a5c501c45 # v1.11.1
      - run: pnpm --filter hoa build
      # Every preview shares the preview database, so migrations must stay backward compatible.
      - run: pnpm --filter hoa run db:migrate:preview
      - run: pnpm --filter hoa run db:seed:preview
      - name: Deploy the preview
        id: preview
        run: |
          pnpm --filter hoa run deploy:preview --name "$PREVIEW_NAME" 2>&1 | tee preview.log
          url=$(grep -oE "https://${PREVIEW_NAME}-hoa\.[a-z0-9.-]+\.workers\.dev" preview.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          if [ -n "$PREVIEW_URL" ]; then body="**Preview:** $PREVIEW_URL (commit ${GITHUB_SHA::7})"; else body="**Preview:** deployed for commit ${GITHUB_SHA::7}, but Cloudflare returned no URL. Check the Deploy a preview job log."; fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body" --edit-last --create-if-none
