name: Verify

# The required verification, shared by the pull request and deploy pipelines.
on:
  workflow_call:

jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    env:
      # Turbo Remote Cache. Set TURBO_TOKEN (secret) and TURBO_TEAM (variable) in the
      # repository settings to share the cache across CI runs and contributors.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm verify
