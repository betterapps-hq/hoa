name: Preview cleanup

# Deletes a pull request's Worker Preview when the pull request is merged or closed.
on:
  pull_request:
    types: [closed]

# Shares the pull request workflow's group, so closing a pull request cancels a preview still being deployed instead of
# racing it: the preview would otherwise be created after this deletes it.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  delete:
    name: Delete the preview
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # A pull request closed before its preview deployed has nothing to delete.
      # An explicit bash shell runs with pipefail, so the delete's own failure reaches the if.
      - shell: bash
        run: |
          if ! pnpm --filter hoa exec wrangler preview delete --name "$PREVIEW_NAME" 2>&1 | tee delete.log; then
            grep -q "Preview not found" delete.log || exit 1
            echo "No preview named $PREVIEW_NAME to delete."
          fi
