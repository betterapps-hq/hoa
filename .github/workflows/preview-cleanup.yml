name: Preview cleanup

# Deletes a pull request's Worker Preview when the pull request is merged or closed.
on:
  pull_request:
    types: [closed]

jobs:
  delete:
    name: Delete the preview
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter hoa exec wrangler preview delete --name "pr-${{ github.event.pull_request.number }}"
