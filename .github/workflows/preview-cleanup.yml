name: Preview cleanup

# Deletes a pull request's Worker Preview when the pull request is merged or closed.
on:
  pull_request:
    types: [closed]

# Shares the pull request workflow's group, so closing a pull request cancels a preview still being deployed instead of
# racing it: the preview would otherwise be created after this deletes it.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skipped where the run gets no Cloudflare token, as with Dependabot's and forks' pull requests, which get no preview.
  delete:
    name: Delete the preview
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' && github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@ee2dce3e338d7684c9a8ec2a733d37d1bd5cf7dc # v1.3.0
      # The Worker is named explicitly: on a closed pull request Wrangler didn't always resolve it from the config.
      # A pull request closed before its preview deployed has nothing to delete. Merging also deploys the Worker, and
      # while that runs Cloudflare can report the Worker missing, so that error is retried.
      # An explicit bash shell runs with pipefail, so the delete's own failure reaches the if.
      - shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm --filter hoa exec wrangler preview delete --worker-name hoa --name "$PREVIEW_NAME" 2>&1 | tee delete.log; then
              exit 0
            fi
            if grep -q "Preview not found" delete.log; then
              echo "No preview named $PREVIEW_NAME to delete."
              exit 0
            fi
            grep -q "Worker does not exist" delete.log || exit 1
            echo "The Worker is being deployed; retrying in 30 seconds."
            sleep 30
          done
          exit 1
