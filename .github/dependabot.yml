version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR for routine minor/patch bumps to keep noise down.
      dependencies:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    # The shared setup action isn't under .github/workflows, so it's listed too.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
