packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
verifyDepsBeforeRun: error
# Versions locked once for the whole monorepo. Reference them with "catalog:".
catalog:
  "@types/node": 26.6.4
  typescript: 7.0.1-rc
# React and React DOM must resolve to one exact, identical version: react-dom throws on a
# mismatch, and the registry mirror tags canaries as "latest", so a bare install drifts.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true
  "@parcel/watcher": true
  "@swc/core": true
  # Downloads the platform binary for Cloudflare's runtime (wrangler and the Vite plugin).
  workerd: true
